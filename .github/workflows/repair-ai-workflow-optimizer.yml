name: Repair ai-workflow-optimizer v2
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Build clean tree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          clean_dir="$RUNNER_TEMP/ai-workflow-clean"
          rm -rf "$clean_dir"
          mkdir -p "$clean_dir"
          git -C "$clean_dir" init
          git -C "$clean_dir" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$clean_dir" -c http.extraheader="AUTHORIZATION: bearer $GH_TOKEN" fetch origin main
          parent="$(git -C "$clean_dir" rev-parse refs/remotes/origin/main)"
          python3 - <<'PY2'
          import base64
          import os
          from pathlib import Path
          files = {
              'README.md': '',
              'SKILL.md': '',
              'agents/openai.yaml': '',
              'references/audit-method.md': '',
              'references/change-protocol.md': '',
              'references/evaluation.md': '',
              'references/sharing.md': '',
              'references/sources.md': '',
              'scripts/audit.py': '',
              'tests/test_audit.py': '',
          }
          root = Path(os.environ["RUNNER_TEMP"]) / "ai-workflow-clean"
          for name, data in files.items():
              target = root / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(data))
          PY2
          git -C "$clean_dir" add -A -- .
          tree="$(git -C "$clean_dir" write-tree)"
          commit="$(printf '%s\n' 'Publish complete ai-workflow-optimizer Skill' | git -C "$clean_dir" commit-tree "$tree" -p "$parent")"
          git -C "$clean_dir" -c http.extraheader="AUTHORIZATION: bearer $GH_TOKEN" push origin "$commit:refs/heads/main"
