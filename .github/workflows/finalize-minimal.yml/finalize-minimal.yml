name: Finalize minimal ai-workflow-optimizer
on:
  push:
permissions:
  contents: write
jobs:
  clean:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Publish only SKILL.md
        run: |
          set -euo pipefail
          clean_dir="$RUNNER_TEMP/ai-workflow-minimal"
          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf "$clean_dir"
          mkdir -p "$clean_dir"
          git -C "$clean_dir" init
          git -C "$clean_dir" config user.name "yezg9920-kely"
          git -C "$clean_dir" config user.email "255814951+yezg9920-kely@users.noreply.github.com"
          git -C "$clean_dir" remote add origin "$remote_url"
          git -C "$clean_dir" fetch origin main
          parent="$(git -C "$clean_dir" rev-parse refs/remotes/origin/main)"
          python3 - <<'PY2'
          import base64
          import os
          from pathlib import Path
          data = ''
          root = Path(os.environ["RUNNER_TEMP"]) / "ai-workflow-minimal"
          (root / "SKILL.md").write_bytes(base64.b64decode(data))
          PY2
          git -C "$clean_dir" add -A -- .
          tree="$(git -C "$clean_dir" write-tree)"
          commit="$(printf '%s\n' 'Publish minimal ai-workflow-optimizer Skill' | git -C "$clean_dir" commit-tree "$tree" -p "$parent")"
          git -C "$clean_dir" push origin "$commit:refs/heads/main"
